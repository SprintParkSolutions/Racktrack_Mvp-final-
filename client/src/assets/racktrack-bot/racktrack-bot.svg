<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 148 168" fill="none" role="img" aria-label="RackTrack assistant">
<title>RackTrack assistant</title>
<!--
  RackTrack mascot - self-contained and animated.

  The animation lives inside the file, so this works as <img src>, as a CSS
  background, or inlined.  Gradient ids are prefixed rtb- because ids in an
  inlined SVG are global to the page: two copies of an unprefixed 'bArm' on
  one screen and the second one silently repaints the first.

  Sizing: the viewBox is 148x168, so set a width and the height follows.
  Nothing here is dark or light specific - the body is white, the shadow is
  a soft navy at low opacity, so it sits on either ground.
-->
<style>
  .rtb-body   { animation: rtbFloat  4.2s ease-in-out infinite;
                transform-origin: 74px 100px; }
  .rtb-arm-l  { animation: rtbWave   4.2s ease-in-out infinite;
                transform-box: fill-box; transform-origin: right top; }
  .rtb-arm-r  { animation: rtbPoint  2.6s ease-in-out infinite;
                transform-box: fill-box; transform-origin: left bottom; }
  .rtb-shadow { animation: rtbShadow 4.2s ease-in-out infinite;
                transform-box: fill-box; transform-origin: center; }

  @keyframes rtbFloat  { 0%,100% { transform: translateY(0) }
                         50%     { transform: translateY(-6px) } }
  @keyframes rtbWave   { 0%,100% { transform: rotate(0deg) }
                         42%,58% { transform: rotate(-14deg) } }
  @keyframes rtbPoint  { 0%,100% { transform: rotate(0deg) translateX(0) }
                         45%,62% { transform: rotate(-9deg) translateX(2px) } }
  @keyframes rtbShadow { 0%,100% { transform: scaleX(1);   opacity: 1 }
                         50%     { transform: scaleX(.84); opacity: .6 } }

  /* Someone who asked the OS for less motion gets a still mascot. */
  @media (prefers-reduced-motion: reduce) {
    .rtb-body, .rtb-arm-l, .rtb-arm-r, .rtb-shadow { animation: none; }
  }
</style>
<defs>
<linearGradient id="rtb-white" x1="40" y1="24" x2="118" y2="104" gradientUnits="userSpaceOnUse">
<stop stop-color="#ffffff"/><stop offset=".55" stop-color="#f4f7fd"/><stop offset="1" stop-color="#d7e0ef"/>
</linearGradient>
<linearGradient id="rtb-white2" x1="44" y1="96" x2="112" y2="158" gradientUnits="userSpaceOnUse">
<stop stop-color="#ffffff"/><stop offset=".5" stop-color="#f1f5fc"/><stop offset="1" stop-color="#cfd9ea"/>
</linearGradient>
<linearGradient id="rtb-visor" x1="46" y1="42" x2="106" y2="84" gradientUnits="userSpaceOnUse">
<stop stop-color="#24407f"/><stop offset=".5" stop-color="#152c63"/><stop offset="1" stop-color="#0b1a40"/>
</linearGradient>
<linearGradient id="rtb-arm" x1="0" y1="0" x2="1" y2="1">
<stop stop-color="#6f9bff"/><stop offset="1" stop-color="#1f45c4"/>
</linearGradient>
<radialGradient id="rtb-floor" cx="0" cy="0" r="1" gradientTransform="translate(74 162) rotate(90) scale(6 38)" gradientUnits="userSpaceOnUse">
<stop stop-color="#0d1f4d" stop-opacity=".26"/><stop offset="1" stop-color="#0d1f4d" stop-opacity="0"/>
</radialGradient>
</defs>
<ellipse class="rtb-shadow" cx="74" cy="162" rx="36" ry="6" fill="url(#rtb-floor)"/>
<g class="rtb-body">
<circle cx="74" cy="9" r="6" fill="url(#rtb-arm)"/>
<circle cx="71.8" cy="7" r="2.1" fill="#eaf1ff" opacity=".9"/>
<path d="M74 15v11" stroke="#c3cee2" stroke-width="3.4" stroke-linecap="round"/>
<g class="rtb-arm-l">
<path d="M44 112q-18 8-16 30" stroke="url(#rtb-arm)" stroke-width="13" stroke-linecap="round" fill="none"/>
<path d="M42 114q-14 7-13 25" stroke="#9dbcff" stroke-width="3.6" stroke-linecap="round" fill="none" opacity=".55"/>
</g>
<g class="rtb-arm-r">
<path d="M104 114q16-2 26-18" stroke="url(#rtb-arm)" stroke-width="13" stroke-linecap="round" fill="none"/>
<path d="M105 112q14-2 23-16" stroke="#9dbcff" stroke-width="3.4" stroke-linecap="round" fill="none" opacity=".5"/>
<circle cx="133" cy="92" r="8" fill="url(#rtb-arm)"/>
<circle cx="130.6" cy="89.4" r="2.6" fill="#dbe8ff" opacity=".85"/>
</g>
<rect x="63" y="82" width="22" height="16" rx="7" fill="#dbe3f1"/>
<rect x="42" y="92" width="64" height="60" rx="26" fill="url(#rtb-white2)"/>
<rect x="42.7" y="92.7" width="62.6" height="58.6" rx="25.3" stroke="#fff" stroke-opacity=".9"/>
<path d="M54 102q12-6 24-4" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".95"/>
<path d="M50 138q10 10 30 9" stroke="#b4c2d8" stroke-width="3.4" stroke-linecap="round" opacity=".5"/>
<g class="rtb-mark">
<rect x="60.5" y="109.5" width="27" height="31" rx="6" fill="#eef3fd" stroke="#1a3fd4" stroke-width="3"/>
<rect x="65" y="114" width="18" height="5" rx="1.6" fill="#1a3fd4"/>
<rect x="65" y="122" width="18" height="5" rx="1.6" fill="#5b86f0"/>
<rect x="65" y="130" width="18" height="5" rx="1.6" fill="#1a3fd4"/>
<circle cx="79.5" cy="124.5" r="1.5" fill="#eef3fd"/>
</g>
<rect x="26" y="26" width="96" height="64" rx="27" fill="url(#rtb-white)"/>
<rect x="26.7" y="26.7" width="94.6" height="62.6" rx="26.3" stroke="#fff" stroke-opacity=".95"/>
<path d="M42 38q16-8 34-6" stroke="#fff" stroke-width="4.6" stroke-linecap="round" opacity=".95"/>
<path d="M34 74q12 14 40 13" stroke="#b7c4da" stroke-width="3.6" stroke-linecap="round" opacity=".45"/>
<rect x="38" y="38" width="72" height="40" rx="18" fill="url(#rtb-visor)"/>
<path d="M44 46q10-5 22-4" stroke="#4b69ac" stroke-width="2.6" stroke-linecap="round" opacity=".5"/>
<g class="rtb-eyes" stroke="#cfe0ff" stroke-width="5.2" stroke-linecap="round" fill="none">
<path d="M56 60q5-8 10 0"/>
<path d="M82 60q5-8 10 0"/>
<path d="M66 66q8 6 16 0" stroke-width="4.2"/>
</g>
<rect x="16" y="44" width="12" height="26" rx="6" fill="url(#rtb-arm)"/>
<rect x="120" y="44" width="12" height="26" rx="6" fill="url(#rtb-arm)"/>
<circle cx="22" cy="54" r="2.4" fill="#dbe8ff" opacity=".8"/>
<circle cx="126" cy="54" r="2.4" fill="#dbe8ff" opacity=".8"/>
</g>
</svg>
