name: CI

on:
  push:
    # july9_full is the branch deploy.ps1 pulls, so it is what actually ships.
    # Work lands there as direct commits, which match neither `main` nor
    # `pull_request` — without it here, every gate below is dead weight.
    branches: [main, july9_full]
  pull_request:
  # Weekly run, independent of any push. Catches drift that a quiet week hides:
  # a transitive dependency that started failing, an environment change, a test
  # that only breaks against a fresh install. Monday 06:00 UTC.
  schedule:
    - cron: '0 6 * * 1'
  # And a button in the Actions tab to run the whole gate on demand.
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Secret scanning. .gitleaks.toml has been in the repo for a while with
  # nothing invoking it, so it caught none of the credentials that reached a
  # pushed branch. Blocking, because a leaked secret costs more than a red build.
  # ---------------------------------------------------------------------------
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan history, not just the tip

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Node: server unit/smoke tests + client production build.
  # ---------------------------------------------------------------------------
  node:
    name: Node (server + client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20

      # --- server ---
      - name: Install server deps
        working-directory: server
        run: npm ci

      # Tests before lint, deliberately: both must pass, but if lint runs first
      # a style failure aborts the job and the behavioural check never executes.
      - name: Test server
        working-directory: server
        run: npm test --if-present

      - name: Lint server
        working-directory: server
        run: npm run lint --if-present

      # --- client ---
      - name: Install client deps
        working-directory: client
        run: npm ci

      - name: Test client
        working-directory: client
        run: npm test --if-present

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Lint client
        working-directory: client
        run: npm run lint --if-present

  # ---------------------------------------------------------------------------
  # Browser sweep. Drives the BUILT client in a real browser as a signed-in
  # user across every major route and fails on a white screen, an icon that
  # renders as literal text, horizontal overflow at 320px, a sub-16px input,
  # or any console error. This is the gate the unit suites cannot be: build,
  # lint and 200+ tests once all passed while every icon rendered as its name.
  # All APIs are stubbed in-browser, so no server or database is needed.
  # ---------------------------------------------------------------------------
  browser:
    name: Browser sweep (built client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install client deps
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Install e2e deps + Chromium
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      # Serve and sweep in ONE step: a background server started in a separate
      # step is not reliably alive in the next one.
      - name: Serve the built client and run the sweep
        env:
          BASE_URL: https://localhost:4173
        run: |
          (cd client && npm run preview &)
          for i in $(seq 1 30); do
            curl -ksf https://localhost:4173/ >/dev/null && break
            sleep 1
          done
          curl -ksf https://localhost:4173/ >/dev/null || { echo "preview server did not come up" >&2; exit 1; }
          cd e2e && node sweep.mjs

  # ---------------------------------------------------------------------------
  # Python: install the CV/pipeline deps, unit-test the weight-free logic, and
  # smoke-import the heavy libraries.
  #
  # The pytest step is a REAL gate (no continue-on-error): pipeline/tests covers
  # the pure geometry/config/lookup code — port numbering, patch-panel count
  # reconciliation, config loading, device-model matching — none of which needs
  # model weights or a GPU. The smoke import stays best-effort because it pulls
  # torch and has no weights available in CI — a green import only proves the
  # dependency set resolves and installs, not that inference works.
  # ---------------------------------------------------------------------------
  python:
    name: Python (pipeline deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements.txt -r requirements-dev.txt

      # --- code standards (config in pyproject.toml) ---
      # Formatting + lint are a REAL gate: the pipeline is now benchmarked against
      # PEP 8 / PEP 257 (via Ruff). The rule set starts pragmatic and only tightens.
      - name: Format check (Ruff / PEP 8)
        run: ruff format --check pipeline

      - name: Lint (Ruff — PEP 8, imports, bugs, security)
        run: ruff check pipeline

      # Type checking is best-effort while the legacy code is gradually typed.
      - name: Type check (mypy, best-effort)
        continue-on-error: true
        run: mypy pipeline

      # Python security linter — a real gate; reviewed-safe rules are skipped in pyproject.
      - name: Security scan (Bandit)
        run: bandit -c pyproject.toml -r pipeline -ll

      # Dependency vulnerabilities in the Python libraries — a real gate.
      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt --no-deps

      # Real gate. Run from the repo root: the modules import each other as
      # `pipeline.*`, so the root has to be the working directory.
      - name: Test pipeline (unit, no model weights)
        run: python -m pytest pipeline/tests -q --cov=pipeline --cov-report=term-missing

      - name: Smoke import (best-effort)
        continue-on-error: true
        run: python -c "import ultralytics, torch, cv2; print('imports OK', torch.__version__)"

  # ---------------------------------------------------------------------------
  # Container scan + software bill of materials (SBOM). Scans the image we ship
  # for OS-level vulnerabilities (Trivy) and publishes an ingredients list.
  # ---------------------------------------------------------------------------
  container:
    name: Container scan (Trivy) + SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t racktrack:ci .

      - name: Vulnerability scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: racktrack:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: racktrack:ci
          format: cyclonedx
          output: racktrack-sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: racktrack-sbom.cdx.json

      # Licence compliance. Enterprise buyers ask what open-source licences we
      # ship; strongly-copyleft ones (GPL/AGPL) can carry obligations we do not
      # want in a proprietary product. Reported, not blocking — a new licence
      # should prompt a human decision, not a red build.
      - name: Licence scan (report)
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: racktrack:ci
          scanners: license
          severity: HIGH,CRITICAL

  # ---------------------------------------------------------------------------
  # Static application security testing (SAST) over our own code. Semgrep reads
  # the source for injection, path traversal, unsafe calls, etc. Runs on the
  # OWASP + framework rule packs.
  # ---------------------------------------------------------------------------
  sast:
    name: Code security scan (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/expressjs
            p/react
            p/python
